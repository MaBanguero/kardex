# =============================================================================
# KARDEX — docker-compose for Coolify / production
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kardex}
      POSTGRES_USER: ${POSTGRES_USER:-kardex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kardex}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kardex}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Coolify proxy se conecta al puerto mapeado
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      POSTGRES_DB: ${POSTGRES_DB:-kardex}
      POSTGRES_USER: ${POSTGRES_USER:-kardex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kardex}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8000)); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
