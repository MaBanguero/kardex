<div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    <!-- Configuración del Sistema -->
    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 animate-fade-in">
        <div class="flex items-center gap-4 mb-6">
            <div class="w-12 h-12 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center text-xl">
                <i class="fas fa-cog"></i>
            </div>
            <div>
                <h3 class="font-bold text-slate-800 text-lg">Reglas del Sistema</h3>
                <p class="text-[10px] text-slate-400 font-black uppercase tracking-widest">Ventana de devolución</p>
            </div>
        </div>

        <form id="form-configuracion" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Horas límite para devolución</label>
                <div class="relative">
                    <input type="number" id="cfg-horas" min="1" max="168" value="2" required
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-2xl font-black text-center text-slate-800 focus:ring-4 focus:ring-purple-500/10 outline-none">
                </div>
                <p class="text-[10px] text-slate-400 mt-1 font-medium">Define cuántas horas después de una salida el usuario puede devolver medicamentos.</p>
            </div>

            <!-- Toggle Alertas -->
            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-rose-50 text-rose-600 rounded-xl flex items-center justify-center text-lg">
                            <i class="fas fa-bell"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-slate-800">Alertas de Stock</h4>
                            <p class="text-[10px] text-slate-400 font-medium">Muestra alertas cuando un producto está por debajo del mínimo</p>
                        </div>
                    </div>
                    <div>
                        <label class="inline-flex items-center gap-3 cursor-pointer select-none" for="cfg-alertas">
                            <span id="cfg-alertas-label" class="text-sm font-bold text-slate-500">ACTIVAS</span>
                            <div class="relative">
                                <input type="checkbox" id="cfg-alertas" class="hidden" checked>
                                <div id="cfg-alertas-track" class="w-14 h-7 bg-emerald-500 rounded-full transition-all duration-300 shadow-inner"></div>
                                <div id="cfg-alertas-knob" class="absolute top-0.5 left-0.5 w-6 h-6 bg-white rounded-full shadow-md transition-all duration-300 transform translate-x-7"></div>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <button type="submit" id="btn-save-cfg" class="w-full bg-purple-600 text-white py-4 rounded-2xl font-black text-lg hover:bg-purple-700 shadow-lg shadow-purple-600/20 transition-all active:scale-95">
                Guardar Configuración
            </button>
        </form>
    </div>

    <!-- Visor de Movimientos -->
    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 animate-fade-in flex flex-col">
        <div class="flex items-center justify-between gap-4 mb-6">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-cyan-50 text-cyan-600 rounded-2xl flex items-center justify-center text-xl">
                    <i class="fas fa-clipboard-list"></i>
                </div>
                <div>
                    <h3 class="font-bold text-slate-800 text-lg">Movimientos del Sistema</h3>
                    <p class="text-[10px] text-slate-400 font-black uppercase tracking-widest">Auditoría completa</p>
                </div>
            </div>
            <button onclick="cargarMovimientos()" class="text-[10px] font-black uppercase bg-slate-100 text-slate-500 px-3 py-2 rounded-lg hover:bg-cyan-500 hover:text-white transition flex items-center gap-1">
                <i class="fas fa-sync-alt"></i> Refrescar
            </button>
        </div>

        <div class="flex-1 overflow-y-auto max-h-[500px] pr-2 space-y-3" id="contenedor-movimientos">
            <div class="text-center p-8 text-slate-400 italic">
                <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                <p>Cargando movimientos...</p>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== CONFIGURACIÓN ==========
    function actualizarToggleAlertas(habilitadas) {
        const checkbox = document.getElementById('cfg-alertas');
        const track = document.getElementById('cfg-alertas-track');
        const knob = document.getElementById('cfg-alertas-knob');
        const label = document.getElementById('cfg-alertas-label');
        if (!checkbox || !track || !knob || !label) return;
        checkbox.checked = habilitadas;
        if (habilitadas) {
            track.className = 'w-14 h-7 bg-emerald-500 rounded-full transition-all duration-300 shadow-inner';
            knob.className = 'absolute top-0.5 left-0.5 w-6 h-6 bg-white rounded-full shadow-md transition-all duration-300 transform translate-x-7';
            label.textContent = 'ACTIVAS';
            label.className = 'text-sm font-bold text-emerald-600';
        } else {
            track.className = 'w-14 h-7 bg-slate-300 rounded-full transition-all duration-300 shadow-inner';
            knob.className = 'absolute top-0.5 left-0.5 w-6 h-6 bg-white rounded-full shadow-md transition-all duration-300 transform translate-x-0';
            label.textContent = 'INACTIVAS';
            label.className = 'text-sm font-bold text-slate-400';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Cargar configuración actual
        fetch("{% url 'api_gestion_configuracion' %}", {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
            body: JSON.stringify({accion: 'obtener'})
        })
        .then(r => r.json())
        .then(d => {
            if(d.status === 'success' && d.config) {
                document.getElementById('cfg-horas').value = d.config.horas_limite_devolucion;
                actualizarToggleAlertas(d.config.alertas_habilitadas);
                window.alertasHabilitadas = d.config.alertas_habilitadas;
            }
        });

        // Click en toggle manual
        const cfgAlertas = document.getElementById('cfg-alertas');
        if (cfgAlertas) {
            cfgAlertas.addEventListener('change', function() {
                actualizarToggleAlertas(this.checked);
            });
        }
    });

    document.getElementById('form-configuracion').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-save-cfg');
        btn.disabled = true; btn.innerText = 'Guardando...';

        fetch("{% url 'api_gestion_configuracion' %}", {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
            body: JSON.stringify({
                accion: 'guardar',
                horas_limite_devolucion: document.getElementById('cfg-horas').value,
                alertas_habilitadas: document.getElementById('cfg-alertas').checked
            })
        })
        .then(r => r.json())
        .then(d => {
            if(d.status === 'success') {
                btn.innerText = '✅ Guardado';
                const hab = document.getElementById('cfg-alertas').checked;
                window.alertasHabilitadas = hab;
                actualizarToggleAlertas(hab);
                if(typeof renderAdminTable === 'function') renderAdminTable();
            } else alert('❌ ' + d.mensaje);
        })
        .finally(() => setTimeout(() => { btn.disabled = false; btn.innerText = 'Guardar Configuración'; }, 1500));
    });

    // ========== MOVIMIENTOS ==========
    function cargarMovimientos() {
        const cont = document.getElementById('contenedor-movimientos');
        cont.innerHTML = '<div class="text-center p-8 text-slate-400 italic"><i class="fas fa-spinner fa-spin text-2xl mb-2"></i><p>Cargando...</p></div>';

        fetch("{% url 'api_listar_movimientos' %}")
        .then(r => r.json())
        .then(d => {
            if(d.status !== 'success' || !d.movimientos.length) {
                cont.innerHTML = '<div class="text-center p-8 text-slate-400 italic border-2 border-dashed border-slate-100 rounded-xl"><i class="fas fa-inbox text-3xl mb-2 opacity-50 block"></i>No hay movimientos registrados.</div>';
                return;
            }

            const colores = {
                'ENTRADA': 'bg-emerald-50 text-emerald-600 border-emerald-100',
                'SALIDA': 'bg-red-50 text-red-600 border-red-100',
                'TRASLADO': 'bg-amber-50 text-amber-600 border-amber-100',
                'DEVOLUCION': 'bg-blue-50 text-blue-600 border-blue-100'
            };

            cont.innerHTML = d.movimientos.map(m => {
                const badge = colores[m.tipo_mov] || 'bg-slate-50 text-slate-600 border-slate-100';
                const detHtml = m.detalles.map(det =>
                    `<span class="text-[10px] bg-white border border-slate-100 px-2 py-0.5 rounded font-bold">${det.cantidad}x ${det.medicamento} (${det.lote})</span>`
                ).join(' ');

                return `
                    <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 hover:shadow-sm transition">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-2">
                                <span class="px-2.5 py-1 text-[9px] font-black uppercase rounded-lg border ${badge}">${m.tipo_mov}</span>
                                <span class="text-[10px] text-slate-400 font-bold">#${m.id}</span>
                            </div>
                            <span class="text-[10px] text-slate-400 font-bold">${m.fecha}</span>
                        </div>
                        <div class="flex flex-wrap gap-1 mb-2">${detHtml}</div>
                        <div class="text-[9px] text-slate-500 font-medium">
                            <i class="fas fa-user mr-1"></i>${m.usuario}
                            <span class="mx-1">|</span>
                            <i class="fas fa-arrow-right mr-1"></i>${m.origen} → ${m.destino}
                            ${m.id_paciente !== '-' ? `<span class="mx-1">|</span><i class="fas fa-user-injured mr-1"></i>${m.id_paciente}` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        })
        .catch(err => {
            cont.innerHTML = '<div class="text-center p-8 text-red-400">Error al cargar movimientos.</div>';
            console.error(err);
        });
    }
</script>
