<div id="seccion-traslados-pendientes" class="mb-6 hidden animate-fade-in">
    <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-3xl p-6 shadow-sm">
        <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center">
                <i class="fas fa-truck-loading"></i>
            </div>
            <div>
                <h3 class="font-bold text-slate-800">Traslados Pendientes de Aceptación</h3>
                <p class="text-[10px] text-slate-500 font-medium">Los siguientes envíos requieren tu firma para ser recibidos</p>
            </div>
        </div>
        <div id="lista-traslados-pendientes" class="space-y-3">
            <div class="text-center py-4 text-slate-400 italic text-sm">
                <i class="fas fa-spinner fa-spin mr-2"></i>Verificando traslados...
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    cargarTrasladosPendientes();
});

function cargarTrasladosPendientes() {
    fetch("{% url 'api_listar_movimientos' %}")
        .then(r => r.json())
        .then(d => {
            if (d.status !== 'success') return;
            const pendientes = (d.movimientos || []).filter(m =>
                m.tipo_mov === 'TRASLADO' && !m.aceptado && m.destino === '{{ ubicacion.nombre }}'
            );
            const seccion = document.getElementById('seccion-traslados-pendientes');
            const lista = document.getElementById('lista-traslados-pendientes');
            if (pendientes.length === 0) {
                seccion.classList.add('hidden');
                return;
            }
            seccion.classList.remove('hidden');
            lista.innerHTML = pendientes.map(m => {
                const detHtml = (m.detalles || []).map(det =>
                    `<span class="inline-block text-[10px] bg-white border border-amber-100 px-2 py-0.5 rounded font-bold">${det.cantidad}x ${det.medicamento} (${det.lote})</span>`
                ).join(' ');
                return `
                    <div class="bg-white border border-amber-100 rounded-2xl p-4 flex flex-col md:flex-row md:items-center gap-4 shadow-sm">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[9px] font-black uppercase px-1.5 py-0.5 rounded bg-amber-100 text-amber-700">Traslado #${m.id}</span>
                                <span class="text-[9px] text-slate-400">${m.fecha}</span>
                            </div>
                            <div class="flex flex-wrap gap-1 mt-1">${detHtml}</div>
                            <p class="text-[10px] text-slate-500 mt-1">
                                <i class="fas fa-arrow-right text-amber-500 mr-1"></i> ${m.origen} → ${m.destino}
                            </p>
                        </div>
                        <div class="flex-shrink-0 flex flex-col gap-2">
                            <a href="/kardex/remision-traslado/${m.id}/" target="_blank"
                               class="text-center text-[10px] font-bold text-blue-600 border border-blue-200 px-4 py-2 rounded-xl hover:bg-blue-50 transition">
                                <i class="fas fa-file-alt mr-1"></i> Ver Remisión
                            </a>
                            <button onclick="abrirModalAceptarTraslado(${m.id})"
                                    class="text-center bg-emerald-500 text-white px-4 py-2 rounded-xl text-[10px] font-bold hover:bg-emerald-600 transition shadow-sm">
                                <i class="fas fa-pen-signature mr-1"></i> Aceptar y Firmar
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        })
        .catch(() => {});
}

function abrirModalAceptarTraslado(docId) {
    const nombre = prompt('Ingrese su nombre completo:');
    if (!nombre || !nombre.trim()) return;
    const cedula = prompt('Ingrese su número de cédula:');
    if (!cedula || !cedula.trim()) return;

    fetch("{% url 'api_aceptar_traslado' %}", {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({
            doc_id: docId,
            firma_nombre: nombre.trim(),
            firma_cedula: cedula.trim()
        })
    })
    .then(r => r.json())
    .then(d => {
        if (d.status === 'success') {
            alert('✅ ' + d.mensaje);
            cargarTrasladosPendientes();
        } else {
            alert('❌ ' + d.mensaje);
        }
    })
    .catch(err => alert('❌ Error de red: ' + err.message));
}
</script>
